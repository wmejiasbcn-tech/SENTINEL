name: WAIPL Verification Gate v1.0
on:
  push:
    paths: ["07_ACCIONES_Y_VERIFICACIONES/GATE/**", "00_CONSTITUCION/WAIPL_VERIFICATION_GATE_v1.0*", ".github/workflows/gate-v1.yml"]
  pull_request:
    paths: ["07_ACCIONES_Y_VERIFICACIONES/GATE/**", "00_CONSTITUCION/WAIPL_VERIFICATION_GATE_v1.0*", ".github/workflows/gate-v1.yml"]
jobs:
  gate-tests:
    runs-on: ubuntu-latest
    env:
      SENTINEL_GATE_HMAC_KEY: sentinel-gate-fixture-key
      PYTHONPATH: ${{ github.workspace }}/07_ACCIONES_Y_VERIFICACIONES/GATE
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: unit + adversarial
        run: |
          python -m unittest discover -s "$GITHUB_WORKSPACE/07_ACCIONES_Y_VERIFICACIONES/GATE" -p 'test_*.py' -v
      - name: force-verde must not close AUD-LAB-CARLA-01
        run: |
          python "$GITHUB_WORKSPACE/07_ACCIONES_Y_VERIFICACIONES/GATE/gate_close.py" "$GITHUB_WORKSPACE/07_ACCIONES_Y_VERIFICACIONES/GATE/cases/AUD-LAB-CARLA-01.json" --force-verde; test $? -eq 1
      - name: validate receipts on disk against live Gate
        run: |
          python "$GITHUB_WORKSPACE/07_ACCIONES_Y_VERIFICACIONES/GATE/validate_repo.py"
